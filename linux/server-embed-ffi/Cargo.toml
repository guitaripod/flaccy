[package]
name = "flaccy-server-embed-ffi"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "UniFFI binding that lets the sandboxed Mac app host flaccy-server in its own process"

[lib]
name = "flaccy_server_embed_ffi"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
flaccy-server = { path = "../server" }
uniffi = "0.32"
serde_json = "1"
