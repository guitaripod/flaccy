[package]
name = "flaccy-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Headless OpenSubsonic server for one person's music folder, built on Flaccy's library layer"

[[bin]]
name = "flaccy-server"
path = "src/main.rs"

[dependencies]
flaccy-library = { path = "../library" }
flaccy-shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "process", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
md-5 = "0.10"
sha2 = "0.10"
rand = "0.9"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
dirs = "6"
chrono = "0.4"
notify = "6"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
rpassword = "7"
async-channel = "2"
