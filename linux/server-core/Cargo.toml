[package]
name = "flaccy-server-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Flaccy Server's sync engine as pure logic: stamps, positions, mutations, the listen ledger and the client rebase, shared by the server and every client"

[features]
sim = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
proptest = "1"
