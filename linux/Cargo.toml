[workspace]
members = ["shared"]

[package]
name = "flaccy"
version = "1.11.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Lossless music player for Linux"

[dependencies]
flaccy-shared = { path = "shared" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
cairo-rs = { version = "0.22", features = ["png"] }
gst = { package = "gstreamer", version = "0.25" }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
lofty = "0.22"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
md-5 = "0.10"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
mpris-server = "0.9"
chrono = "0.4"
rand = "0.9"
async-channel = "2"
gst-plugin-gtk4 = { version = "0.15", features = ["gtk_v4_18"] }

[profile.release]
lto = "thin"
strip = true
