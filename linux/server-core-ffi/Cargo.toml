[package]
name = "flaccy-server-core-ffi"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "UniFFI binding of flaccy-server-core's json_api for the Apple clients"

[lib]
name = "flaccy_server_core_ffi"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
flaccy-server-core = { path = "../server-core" }
uniffi = "0.32"
serde_json = "1"
