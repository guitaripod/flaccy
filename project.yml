name: flaccy
include:
  - ../../build/xcodegen/midgar-app.yml
options:
  bundleIdPrefix: com.midgarcorp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.6"
    macOS: "26.0"
    watchOS: "11.0"
settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    MTL_FAST_MATH: YES
  configs:
    Debug:
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      MTL_ENABLE_DEBUG_INFO: NO
      VALIDATE_PRODUCT: YES
packages:
  FlaccyCore:
    path: Core/FlaccyCore
  FlaccyServerCore:
    path: Core/FlaccyServerCore
  FlaccyServerEmbed:
    path: Core/FlaccyServerEmbed
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  MidgarKit:
    path: ../../packages/MidgarKit

x-midgar-keychain-groups: &midgarKeychainGroups
  - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
  - $(AppIdentifierPrefix)cc.midgarcorp.shared

x-distribution-identity: &distributionIdentity "Apple Distribution"

x-app-assets: &appAssets
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  flaccy:
    templates:
      - MidgarApp
    templateAttributes:
      platform: iOS
    sources:
      - path: App
        type: syncedFolder
        excludes:
          - Info.plist
          - flaccy-ios.entitlements
          - Secrets.swift.example
      - path: Features
        type: syncedFolder
      - path: Resources
        type: syncedFolder
    dependencies:
      - package: FlaccyCore
      - package: FlaccyCore
        product: FlaccyEngine
      - package: FlaccyServerCore
      - package: GRDB
      - package: MidgarKit
        product: MidgarCore
      - package: MidgarKit
        product: MidgarCommerce
      - package: MidgarKit
        product: MidgarUI
      - package: MidgarKit
        product: MidgarPortal
      - target: flaccyWatch Watch App
        embed: true
    entitlements:
      path: App/flaccy-ios.entitlements
      properties:
        keychain-access-groups: *midgarKeychainGroups
    scheme:
      testTargets:
        - flaccyTests
        - package: FlaccyCore/FlaccyCoreTests
    settings:
      groups:
        - MidgarIOSApp
      base:
        <<: *appAssets
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        PRODUCT_BUNDLE_IDENTIFIER: com.midgarcorp.flaccy
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development: Marcus Ziadé (AUJJ76QHS7)"
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: flaccy Dev Air
        Release:
          CODE_SIGN_IDENTITY: *distributionIdentity
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: flaccy AppStore 2026

  flaccyMac: &macApp
    templates:
      - MidgarApp
    templateAttributes:
      platform: macOS
    sources:
      - path: Platforms/mac
        type: syncedFolder
        excludes:
          - Info.plist
          - flaccyMac.entitlements
      - path: App
        type: syncedFolder
        excludes:
          - Info.plist
          - flaccy-ios.entitlements
          - Secrets.swift.example
          - AppDelegate.swift
          - AppTabBarController.swift
          - SceneDelegate.swift
          - UI/AdaptiveLayout.swift
          - UI/AppAppearance.swift
          - UI/AsyncImageView.swift
          - UI/DownloadedMarkView.swift
          - UI/FilterChipsView.swift
          - UI/HairlineView.swift
          - UI/IdentifiedSegmentedControl.swift
          - UI/LiquidGlass.swift
          - UI/LoveButton.swift
          - UI/MarqueeLabel.swift
          - UI/NewMixChipView.swift
          - UI/NowPlayingBarsView.swift
          - UI/QualityBadgeView.swift
          - UI/SectionIndexView.swift
          - UI/SourceChipsView.swift
          - UI/SystemVolumeSlider.swift
          - UI/ToastView.swift
          - UI/TrackContextMenu.swift
          - UI/TrackGridCell.swift
      - path: Features
        type: syncedFolder
        excludes:
          - AlbumDetail/AlbumDetailViewController+Delegates.swift
          - AlbumDetail/AlbumDetailViewController+Enrichment.swift
          - AlbumDetail/AlbumDetailViewController+Header.swift
          - AlbumDetail/AlbumDetailViewController.swift
          - AlbumDetail/AlbumTrackCell.swift
          - AlbumDetail/AmbientPaletteBackdropView.swift
          - ArtistDetail/ArtistDetailModels.swift
          - ArtistDetail/ArtistDetailViewController.swift
          - ArtistDetail/ArtistHeaderCell.swift
          - ArtistDetail/ArtistImageService.swift
          - ArtistDetail/ArtistListCells.swift
          - Artwork/ArtworkCropView.swift
          - Artwork/ArtworkEditorViewController.swift
          - Debut/LibraryDebutSheetController.swift
          - Debut/LibraryDebutSummaryCard.swift
          - Debut/LibraryDebutView.swift
          - Enrichment/EnrichmentReportViewController.swift
          - Equalizer/EqualizerControls.swift
          - Equalizer/EqualizerCurveView.swift
          - Equalizer/EqualizerImportViewController.swift
          - Equalizer/EqualizerPresetsViewController.swift
          - Equalizer/EqualizerViewController+Actions.swift
          - Equalizer/EqualizerViewController+Advanced.swift
          - Equalizer/EqualizerViewController+CurveDelegate.swift
          - Equalizer/EqualizerViewController+Layout.swift
          - Equalizer/EqualizerViewController+Presets.swift
          - Equalizer/EqualizerViewController.swift
          - Home/EditHomeViewController.swift
          - Home/HomeAlbumCardCell.swift
          - Home/HomeArtView.swift
          - Home/HomeBackdropView.swift
          - Home/HomeChromeViews.swift
          - Home/HomePromoCells.swift
          - Home/HomeGlanceCards.swift
          - Home/HomeHeroCell.swift
          - Home/HomeJumpTileCell.swift
          - Home/HomeLaunchPlaceholderView.swift
          - Home/HomeMixCardCell.swift
          - Home/HomeSegmentedProgressView.swift
          - Home/HomeSnapshotPlan.swift
          - Home/HomeTrackQuality.swift
          - Home/HomeViewModel.swift
          - Home/HomeSparkView.swift
          - Home/HomeViewController+Actions.swift
          - Home/HomeViewController+DataSource.swift
          - Home/HomeViewController+Layout.swift
          - Home/HomeViewController.swift
          - Library/AlbumCell.swift
          - Library/ComputerTransferGuideViewController.swift
          - Library/DuplicateCopiesViewController.swift
          - Library/LibraryMosaicView.swift
          - Library/LibraryStatusBanner.swift
          - Library/LibraryViewController+Banners.swift
          - Library/LibraryViewController+Binding.swift
          - Library/LibraryViewController+ContextMenus.swift
          - Library/LibraryViewController+DataSource.swift
          - Library/LibraryViewController+Debut.swift
          - Library/LibraryViewController+Delegates.swift
          - Library/LibraryViewController+Layout.swift
          - Library/LibraryViewController+Sample.swift
          - Library/LibraryViewController+Sorting.swift
          - Library/LibraryViewController.swift
          - Library/NewMixShot.swift
          - Library/PlaylistDetailViewController.swift
          - Library/PlaylistListCells.swift
          - ListeningGuide/ListeningGuideViewController.swift
          - LyricShare/LyricShareViewController.swift
          - Lyrics/LyricCells.swift
          - Lyrics/LyricWipeView.swift
          - Lyrics/LyricsViewController+Delegates.swift
          - Lyrics/LyricsViewController+Timing.swift
          - Lyrics/LyricsViewController.swift
          - Lyrics/TimingNoteViews.swift
          - NowPlaying/MiniPlayerView.swift
          - NowPlaying/NowPlayingBackdropView.swift
          - NowPlaying/NowPlayingVersionRow.swift
          - NowPlaying/NowPlayingViewController+Appearance.swift
          - NowPlaying/NowPlayingViewController+CenterState.swift
          - NowPlaying/NowPlayingViewController+Controls.swift
          - NowPlaying/NowPlayingViewController+Delegates.swift
          - NowPlaying/NowPlayingViewController+Layout.swift
          - NowPlaying/NowPlayingViewController+Morph.swift
          - NowPlaying/NowPlayingViewController+Scrubbing.swift
          - NowPlaying/NowPlayingViewController+State.swift
          - NowPlaying/NowPlayingViewController+TrackPan.swift
          - NowPlaying/NowPlayingViewController+Views.swift
          - NowPlaying/NowPlayingViewController.swift
          - NowPlaying/PlayerActionOrder.swift
          - NowPlaying/PlayerActionRowEditor.swift
          - NowPlaying/PlayerContainerViewController.swift
          - NowPlaying/QueueViewController.swift
          - NowPlaying/ScrubberView.swift
          - Paywall/PaywallViewController.swift
          - Paywall/TrialReminderPrompt.swift
          - Paywall/TrialRunwayBannerView.swift
          - Paywall/TrialRunwayPresenter.swift
          - Recap/ChartsViewController.swift
          - Recap/HeatmapView.swift
          - Recap/ListeningClockView.swift
          - Recap/RecapCells.swift
          - Recap/RecapInsightCells.swift
          - Recap/RecapListCells.swift
          - Recap/RecapNotificationScheduler.swift
          - Recap/RecapNotificationsViewController.swift
          - Recap/RecapProfileCells.swift
          - Recap/RecapShareCardView.swift
          - Recap/RecapSkeletonView.swift
          - Recap/YearInMusicStoryView.swift
          - Recap/YearInMusicViewController.swift
          - Remote/RemoteDownloadActions.swift
          - Remote/RemoteShot.swift
          - Search/SearchResultCell.swift
          - Search/SearchViewController.swift
          - ServerSync/FlaccyServerShot.swift
          - ServerSync/ServerSyncBackgroundRefresh.swift
          - Settings/AddFlaccyServerViewController.swift
          - Settings/AddServerViewController.swift
          - Settings/FlaccyServerDetailViewController.swift
          - Settings/FlaccyServerNudgeView.swift
          - Settings/QRScannerViewController.swift
          - Settings/ServerMergeSummaryViewController.swift
          - Settings/SettingsCells.swift
          - Settings/SettingsHeaderView.swift
          - Settings/SettingsViewController+Actions.swift
          - Settings/SettingsViewController+Cells.swift
          - Settings/SettingsViewController+Controls.swift
          - Settings/SettingsViewController+Model.swift
          - Settings/SettingsViewController+Servers.swift
          - Settings/SettingsViewController.swift
          - Sharing/SonglinkShareable.swift
          - Sharing/StreamingLinksViewController.swift
          - Wantlist/WantlistViewController.swift
          - WatchSync/WatchPlayIngestor.swift
          - WatchSync/WatchSyncBackgroundTask.swift
          - WatchSync/WatchSyncCells.swift
          - WatchSync/WatchSyncCopy.swift
          - WatchSync/WatchRemoteExercise.swift
          - WatchSync/WatchSyncExercise.swift
          - WatchSync/WatchSyncHelpViewController.swift
          - WatchSync/WatchSyncMetrics.swift
          - WatchSync/WatchSyncReadiness.swift
          - WatchSync/WatchSyncService.swift
          - WatchSync/WatchSyncServiceDemo.swift
          - WatchSync/WatchSyncServiceTransport.swift
          - WatchSync/WatchSyncSizing.swift
          - WatchSync/WatchSyncStorageMeter.swift
          - WatchSync/WatchSyncViewController.swift
          - WatchSync/WatchTranscoder.swift
          - Welcome/ServerSetupGuideViewController.swift
          - Welcome/WelcomeCopy.swift
          - Welcome/WelcomeFlow.swift
          - Welcome/WelcomeGate.swift
          - Welcome/WelcomeViewController.swift
      - path: Resources
        type: syncedFolder
        excludes:
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
    dependencies:
      - package: FlaccyCore
      - package: FlaccyCore
        product: FlaccyEngine
      - package: FlaccyServerCore
      - package: FlaccyServerEmbed
      - package: GRDB
      - package: MidgarKit
        product: MidgarCore
      - package: MidgarKit
        product: MidgarCommerce
      - package: MidgarKit
        product: MidgarUI
      - package: MidgarKit
        product: MidgarPortal
    entitlements:
      path: Platforms/mac/flaccyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.midgarcorp.flaccy.handoff
        keychain-access-groups: *midgarKeychainGroups
    scheme:
      testTargets:
        - package: FlaccyCore/FlaccyCoreTests
    settings:
      groups:
        - MidgarMacApp
      base: &macBase
        <<: *appAssets
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        EXCLUDED_SOURCE_FILE_NAMES: LaunchScreen.storyboard
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Platforms/mac/Info.plist
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.midgarcorp.flaccy
        PRODUCT_NAME: Flaccy
        SKIP_INSTALL: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: *distributionIdentity
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: flaccy-mac-universal-2026

  flaccyMacLegacy:
    <<: *macApp
    dependencies:
      - package: FlaccyCore
      - package: FlaccyCore
        product: FlaccyEngine
      - package: GRDB
      - package: MidgarKit
        product: MidgarCore
      - package: MidgarKit
        product: MidgarCommerce
      - package: MidgarKit
        product: MidgarUI
      - package: MidgarKit
        product: MidgarPortal
    settings:
      groups:
        - MidgarMacApp
      base:
        <<: *macBase
        PRODUCT_BUNDLE_IDENTIFIER: com.midgarcorp.flaccy.mac
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", LEGACY_MAC_HANDOFF]
      configs:
        Release:
          CODE_SIGN_IDENTITY: *distributionIdentity
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: flaccy-mac-appstore-2026

  flaccyWatch Watch App:
    templates:
      - MidgarApp
    templateAttributes:
      platform: watchOS
    sources:
      - path: Platforms/watch
        type: syncedFolder
        excludes:
          - Info.plist
      - Features/Enrichment/EnrichmentJobCopy.swift
      - Features/Debut/LibraryDebutCopy.swift
      - Features/Library/LibraryLoadPhaseCopy.swift
    dependencies:
      - package: FlaccyCore
    scheme: {}
    settings:
      base:
        <<: *appAssets
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Platforms/watch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Flaccy
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.midgarcorp.flaccy.watchkitapp
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: watchos
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Release:
          CODE_SIGN_IDENTITY: *distributionIdentity
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: flaccy Watch AppStore 2026
          VALIDATE_PRODUCT: YES

  flaccyTests:
    templates:
      - MidgarUnitTests
    templateAttributes:
      platform: iOS
    sources:
      - path: Tests/flaccyTests
    dependencies:
      - target: flaccy
    settings:
      base:
        CLANG_ENABLE_OBJC_WEAK: NO
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.midgarcorp.flaccyTests
        PRODUCT_NAME: $(TARGET_NAME)
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"

  flaccyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/flaccyUITests
        excludes:
          - Flaccy.storekit
    dependencies:
      - target: flaccy
    scheme:
      testTargets:
        - flaccyUITests
      storeKitConfiguration: Tests/flaccyUITests/Flaccy.storekit
    settings:
      groups:
        - MidgarSwift
        - MidgarSigning
        - MidgarBuildHygiene
      base:
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.midgarcorp.flaccyUITests
        PRODUCT_NAME: $(TARGET_NAME)
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SWIFT_EMIT_LOC_STRINGS: NO
        TARGETED_DEVICE_FAMILY: "1"

  flaccyMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/flaccyMacUITests
    dependencies:
      - target: flaccyMac
    scheme:
      testTargets:
        - flaccyMacUITests
    settings:
      groups:
        - MidgarSwift
        - MidgarSigning
        - MidgarBuildHygiene
      base:
        COMBINE_HIDPI_IMAGES: NO
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.midgarcorp.flaccy.mac.uitests
        PRODUCT_NAME: flaccyMacUITests
